# Site assembly. Each listed branch of this repository becomes one documentation version,
# identified by the `version` key in that branch's antora.yml.
site:
  title: FreeCAD CAM documentation (experiment)
  url: https://sliptonic.github.io/CAM_DOC
  start_page: cam::index.adoc
  keys:
    repository: https://github.com/sliptonic/CAM_DOC

content:
  sources:
    - url: .
      branches:
        - wiki
        - main
      edit_url: 'https://github.com/sliptonic/CAM_DOC/edit/{refname}/{path}'

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui

antora:
  extensions:
    - require: '@antora/lunr-extension'

asciidoc:
  attributes:
    experimental: ''
    page-pagination: ''
    hide-uri-scheme: ''
    sectanchors: ''
    idprefix: ''
    idseparator: '-'

runtime:
  log:
    failure_level: warn   # an unresolved xref fails the build
  fetch: false

output:
  dir: ./build/site
