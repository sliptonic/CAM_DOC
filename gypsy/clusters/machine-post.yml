# One cause, all its pages, one pull request. See README.md in this folder.
title: Machine-based post-processing
issue: 3
# Upstream pull requests that this cluster delivers in full: every page they change is here.
prs: [31035, 31589, 31722, 31819, 32081, 32096, 32099, 32129, 32132, 32250, 32274, 32282, 32293,
      32323, 32366, 32367, 32427, 32485, 32615, 32854, 32863, 32886, 33069]
# Pull requests with a different cause. Only their effect on the rewritten pages is delivered
# here; their other pages wait for their own cluster.
partial:
  32903: shared Work Planes; 13 more pages, own cluster
  31720: Custom operation; operations/custom.adoc and reference/scripting.adoc
  32313: Tapping; operations/tapping.adoc
  30644: default folder of file dialogs; job/job.adoc
pages:
  reference:            # already revised (CAM_DOC#1); given to the drafter, not changed
    - output/machine.adoc
  generated:            # written by a tool from the FreeCAD source; requirement of the issue
    - {page: output/posts/genealogy.adoc, command: [tools/post_genealogy.py]}
  rewrite:
    - output/machine-configuration.adoc
    - output/post-process.adoc
    - output/postprocessor-customization.adoc
    - output/mbpp-postprocessor.adoc
  new:
    - output/posts/fanuc.adoc
    - output/posts/heidenhain.adoc
  amend:
    - output/post-process-selected.adoc
    - job/job.adoc
    - job/sanity-check.adoc
    - job/quick-validate.adoc
    - tools/tool-controller.adoc
    - reference/preferences.adoc
    - reference/scripting.adoc
nav:
  - {after: 'xref:output/mbpp-postprocessor.adoc', line: '** xref:output/posts/genealogy.adoc[Post-Processor Genealogy]'}
  - {after: 'xref:output/mbpp-postprocessor.adoc', line: '** xref:output/posts/heidenhain.adoc[Heidenhain Post-Processor]'}
  - {after: 'xref:output/mbpp-postprocessor.adoc', line: '** xref:output/posts/fanuc.adoc[Fanuc Post-Processor]'}
facts:
  - gypsy/facts/machine.json
